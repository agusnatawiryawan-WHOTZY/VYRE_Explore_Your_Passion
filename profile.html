<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VYRE Profile</title>
    <link
      rel="icon"
      href="assets/vyre-favicon-light.svg"
      type="image/svg+xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0..200"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body class="profilePage">
    <div
      class="pageLoader"
      id="pageLoader"
      aria-label="Loading VYRE profile"
      role="status"
    >
      <div class="pageLoaderPanel">
        <div class="loaderBrand">
          <span>VYRE // PROFILE</span><span>PLAYER 01</span>
        </div>
        <div class="loaderCore"><span class="loaderCrosshair"></span></div>
        <h1 class="loaderTitle">ENTER YOUR WORLD</h1>
        <p class="loaderStatus" id="loaderStatus">LOADING PROFILE</p>
        <div class="loaderTrack">
          <div class="loaderProgress" id="loaderProgress"></div>
        </div>
        <div class="loaderMeta">
          <span>Loading profile</span><span>2026</span>
        </div>
      </div>
    </div>
    <header class="authHeader">
      <a class="authBrand" href="index.html">VYRE</a>
      <nav class="profileNav">
        <a href="marketplace.html"
          ><span class="material-symbols-rounded">storefront</span>
          Marketplace</a
        ><a href="cart.html"
          ><span class="material-symbols-rounded">shopping_bag</span>
          Cart</a
        >
      </nav>
    </header>
    <main class="profileMain">
      <section class="profileCard">
        <div class="profileAvatar" id="profileAvatar">V</div>
        <p class="authEyebrow">VYRE / PLAYER PROFILE</p>
        <h1 id="profileName">User</h1>
        <p id="profileEmail" class="profileEmail"></p>
        <div class="profileStats">
          <div>
            <strong id="profileCartCount">0</strong><span>Saved items</span>
          </div>
          <div><strong>ACTIVE</strong><span>Status akun</span></div>
        </div>
        <button class="profileLogout" id="profileLogout" type="button">
          <span class="material-symbols-rounded">logout</span> Sign out
        </button>
      </section>
    </main>
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <script src="js/smooth-scroll.js"></script>
    <script src="js/parallax.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/page-loader.js"></script>
  </body>
</html>
